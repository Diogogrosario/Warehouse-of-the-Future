name: T2 - Mesh network CI/CD

on:
  push:
    branches: [ t2_development ]
  pull_request:
    branches: [ t2_development ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mesh_communication
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Cache the Maven packages to speed up build
      uses: actions/cache@v1    
      with:
        path: ~/.m2  
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Build project with Maven
      run: mvn -B package -f pom.xml

  gen-javadocs:
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mesh_communication
    needs: [build_and_test]
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Generate javadocs
      run: javadoc -notimestamp -d docs/javadoc/ $(find src/main/java -type f)
    - name: setup git config
      run: |
        git config user.name "GitHub Actions Bot [T2]"
        git config user.email "<joaocosta.work@posteo.net>"
    - name: commit
      run: |
        git add docs/javadoc
        git commit -m "Doc: regenerate javadocs"
        git push origin t2_development
    - name: The commit/push failed which is ok
      if: ${{ failure() }}
      run: echo "The commit/push failed which is ok"

  publish-job:
    runs-on: ubuntu-latest
    needs: [build_and_test]
    defaults:
      run:
        working-directory: ./mesh_communication
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: 17
      - run: mvn -B package -f pom.xml -DskipTests
      - run: mkdir staging && cp target/*.jar staging
      - uses: actions/upload-artifact@v2
        with:
          name: t2_mesh_comm
          path: mesh_communication/staging
