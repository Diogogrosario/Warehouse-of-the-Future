openapi: 3.0.0

info:
  version: "1.0"
  title: "playground"
  description: "Backlog specification for playground"

tags: [
    {
      name: "Device",
      description: "Operations on Devices"
    },
    {
      name: "Action",
      description: "Operations on Actions"
    },
    {
      name: "Report",
      description: "Operations on Reports"
    }
  ]

paths:
  # ===================== DEVICES =====================
  /device:
    get:
      operationId: D1
      summary: "D1: Get all Devices."
      description: Retrieves all devices registered in the playground.
      tags: ["Device"]
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                description: "Array containing every device."
                type: array
                items:
                  $ref: "#/components/schemas/Device"
              example:
                - id: 445A
                - id: 85B3
        "404":
          description: "Error: No registered devices."
    delete:
      operationId: "D2"
      summary: "D2: Delete all devices."
      description: "Delete every device."
      tags: ["Device"]
      responses:
        "200":
          description: "Success."
        "500":
          description: "Error: No registered devices."

  /device/{id}:
    get:
      operationId: D3
      summary: "D3: Check if device exists."
      description: "Check if device with specified ID is registered."
      tags: ["Device"]
      parameters:
        - in: "path"
          name: "id"
          description: "ID of device"
          schema:
            type: string
          required: true
      responses:
        "200":
          description: "Success: Device Exists"
        "404":
          description: "Error: No registered device with that ID."
        "500":
          description: "Server Error." 
    post:
      operationId: D4
      summary: "D4: Create new device"
      description: "Register a new device."
      tags: ["Device"]
      parameters:
        - in: "query"
          name: "id"
          description: "ID of device"
          schema:
            type: string
          required: true
      responses:
        "200":
          description: "Success: Device created."
        "400":
          description: "Error: No parameters provided."
    delete:
      operationId: "D5"
      summary: "D5: Delete device."
      description: "Delete the device with the specified ID."
      tags: ["Device"]
      parameters:
        - in: "path"
          name: "id"
          description: "ID of device"
          schema:
            type: string
          required: true
      responses:
        "200":
          description: "Success: Device Deleted."
        "404":
          description: "Error: No registered device with that ID."
        "500":
          description: "Server Error."

# ===================== ACTIONS =====================
  /action:
    get:
      operationId: A1
      summary: "A1: Get all Actions."
      description: Retrieves all actions.
      tags: ["Action"]
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                description: "Array containing every action."
                type: array
                items:
                  $ref: "#/components/schemas/Action"
              example:
                - id: 55
                  report_id: 40
                  employee_id: 54D

                - id: 56
                  report_id: 40
                  employee_id: 53A
        "404":
          description: "Error: No registered devices."
    delete:
      operationId: "A2"
      summary: "A2: Delete all actions."
      description: "Delete every action."
      tags: ["Action"]
      responses:
        "200":
          description: "Success."
        "500":
          description: "Error: No registered actions."
    

  /action/{id}:
    get:
      operationId: A3
      summary: "A3: Get specific action."
      description: Retrieve action with the specified ID.
      tags: ["Action"]
      parameters:
        - in: "path"
          name: "id"
          description: "ID of action"
          schema:
            type: string
          required: true
      responses:
        "200":
          description: "Success."
          content:
            application/json:
              schema:
                description: "Array containing every action."
                type: string
                $ref: "#/components/schemas/Action"
              example:
                - id: 55
                  report_id: 40
                  employee_id: 54D
                  description: "Replaced batery."
                  createdAt: "2021-12-21 15:30"
                  updatedAt: "2021-12-21 15:30"
        "404":
          description: "Error: Action not found."
        "500":
          description: "Server Error."
    post:
      operationId: A4
      summary: "A4: Add new action"
      description: "Register a new action."
      tags: ["Action"]
      parameters:
        - in: "query"
          name: "id"
          description: "ID of device"
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Action"
            example:
              - report_id: 40
                employee_id: 54D
                description: "Replaced Batery."
      responses:
        "200":
          description: "Success: Device created."
        "400":
          description: "Error: No parameters provided."
    put:
      operationId: A5
      summary: "A5: Edit Action."
      description: "Edit a certain action."
      tags: ["Action"]
      parameters:
        - in: query
          name: "id"
          description: "ID of action."
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Action"
      responses:
        "200":
          description: "Success: Action created."
        "404":
          description: "Error: Can't update action."
    delete:
      operationId: A6
      summary: "A6: Delete action."
      description: "Delete the action with the specified ID."
      tags: ["Action"]
      parameters:
        - in: path
          name: "id"
          description: "ID of action."
          schema:
            type: string
          required: true
      responses:
        "200":
          description: "Success: Action deleted."
        "404":
          description: "Error: Action not found."

        

components:
  schemas:

    Device:
      type: object
      properties:
        id:
          description: "ID of the Device."
          type: string

    Action:
      type: object
      properties:
        id: 
          description: "ID of the Action."
          type: string
        report_id:
          description: "ID of the Report to which the current action refers to."
          type: string
        description:
          description: "Description of the Action."
          type: string
        employee_id:
          description: "ID of the employed that executed the action."
          type: string
      example:
        - id: 45
          report_id: 865
          description: "Replaced batery."
          employee_id: 24F

