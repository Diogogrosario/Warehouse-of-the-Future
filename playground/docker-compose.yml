version: "3.9"
services:
    playground:
        build:
            context: ./
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        container_name: playground
        volumes:
            - ".:/app"
            - "/app/node_modules"
        environment:
            - CHOKIDAR_USEPOLLING=true
            - CI=true
        depends_on:
            - db
    db:
        image: postgres:14.1-alpine
        restart: always
        container_name: playground_db
        env_file:
            - .env
        ports:
            - "5432:5432"
