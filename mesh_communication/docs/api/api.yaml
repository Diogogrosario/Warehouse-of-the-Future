openapi: 3.0.0
info:
  description: API for mesh communication backend
  version: 1.0.0
  title: MeshCommunication API

paths:
  /devices/{status}:
    get:
      summary: gets devices by status
      operationId: getAllDevices
      description: 
        Returns devices present in the mesh network with the given status.

      parameters:
        - in: path
          name: status
          description: What type of devices to retrieve
          schema:
            type: string
            enum:
              - all
              - failed
              - operational
          required: true

      responses:
        200:
          description: "Success: Received all devices"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        404:
          description: Couldn't retreive devices

  /devices/{id}:
    get:
      summary: gets a specific device
      operationId: getDevice
      description: 
        Returns devices present in the mesh network with the given id.

      parameters:
        - in: path
          name: id
          description: Id of the device to retrieve
          schema:
            type: integer
          required: true

      responses:
        200:
          description: "Success: Received all devices"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        404:
          description: Device does not exist.

  /devices/inrange/{id}:
    get:
      summary: gets devices within range of another device
      operationId: getDevicesInRange
      description: 
        Returns devices present in the mesh network that are within range of a device with the given id.

      parameters:
        - in: path
          name: id
          description: Id of the device to make the search on
          schema:
            type: integer
          required: true

      responses:
        200:
          description: "Success: Received all devices within range"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        404:
          description: Couldn't retreive devices

  /tick/{time_flow}:
    post:
      summary: update grid
      operationId: position
      description: Path that updates the grid by given number of ticks.
      parameters:
        - in: path
          name: time_flow
          description: In what direction time will advance
          schema:
            type: string
            enum:
              - forwards
              - backwards
          required: true
        - in: query
          name: n_ticks
          description: Number of ticks to skip
          required: false
          schema:
            type: integer
            default: 1

      responses:
        200:
          description: Mesh Grid updated

  /message:
    get:
      summary: Get all messages sent in the current tick
      operationId: getAllMessages
      description:
        Path that returns, for all message senders of the current tick, the messages that were sent by them.      
      responses:
        200:
          description: "Success: Received all messages"
          content:
            application/json:
              schema:
                description: Dictionary in which its keys are the sender's ids, and its values are arrays of messages that were sent by its respective key/sender
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/Message'
              example:
                1:
                  - hop: 68
                    final: 30
                    failed: true
                  - hop: 21
                    final: 45
                    failed: false
                30:
                  - hop: 54
                    final: 2
                    failed: false
                 - hop: 2
                    final: 1
                    failed: false
        404:
          description: "Error: couldn't get current tick messages."

components:
  schemas:
    Message:
      type: object

      properties:
        hop:
          description: ID of the device to receive the message on this hop
          type: integer
        final:
          description: ID of the final destination of the message
          type: integer
        failed:
          description: Wether or not the message was lost in the current tick
          type: boolean

    Device:
      type: object

      properties:
        device_id:
          type: integer
        battery_level:
          type: integer
        position:
          type: object
          properties:
            x:
              type: integer
            y: 
              type: integer
      example:
        device_id: 1
        battery_level: 68
        position:
          x: 2
          y: 1 
