openapi: 3.0.0
info:
  description: API for mesh communication backend
  version: 1.0.0
  title: MeshCommunication API
  
  # # put the contact info for your development or API team
  # contact:
  #   email: you@your-company.com

  # license:
  #   name: Apache 2.0
  #   url: http://www.apache.org/licenses/LICENSE-2.0.html

# tags are used for organizing operations
# tags:
# - name: admins
#   description: Secured Admin-only calls
# - name: developers
#   description: Operations available to regular developers

paths:
  /devices:
    get:
      summary: gets mesh status
      operationId: meshStatus
      description: 
        Generic path that returns all the device's info if no value is present or a specific device if value is present.
        
      parameters:
        - in: query
          name: device
          description: pass an optional integer to specify the wanted device
          required: false
          schema:
            type: integer

      responses:
        200:
          description: "Array containing json specified content"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer

                    messages_to_relay:
                      type: array
                      items:
                        $ref: '#/components/schemas/Message'
                          
                    messages_relayed:
                      type: array
                      items:
                        $ref: '#/components/schemas/Message'
                        
                    messages_received:
                      type: array
                      items:
                        $ref: '#/components/schemas/Message'

                    battery_level:
                      type: integer
                      
                    position:
                      type: object
                      properties:
                        x:
                          type: integer
                        y: 
                          type: integer
                    
              example: 
                device_id: 1
                messages_to_relay: [
                  {
                  type: "Request",
                  source: 0,
                  destination: 9,
                  lastHop: 7,
                  content: "This is a message"
                  },
                ]
                messages_relayed: [
                  {
                  type: "Reply",
                  source: 0,
                  destination: 9,
                  lastHop: 7,
                  content: "This is a message"
                  },
                ]
                messages_received: [
                  {
                  type: "Request",
                  source: 0,
                  destination: 9,
                  lastHop: 7,
                  content: "This is a message"
                  },
                ]
                battery_level: 68
                position:
                  x: 2
                  y: 1

        404:
          description: "Device does not exist."
                
              
                
  /devices/battery:
    get:
      summary: gets mesh devices' battery status
      operationId: batteryStatus
      description: 
        Path that returns all the device's battery level if no value is present or a specific device's if value is present.        
      parameters:
        - in: query
          name: device
          description: pass an optional integer to specify the wanted device
          required: false
          schema:
            type: integer
      responses:
        200:
          description: "Array containing json of devices' battery level"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer
                    battery_level:
                      type: integer  
                    
        404:
          description: "Device does not exist."

  /devices/position:
    get:
      summary: gets mesh devices' position
      operationId: position
      description: 
        Path that returns all the device's position if no value is present or a specific device's if value is present.        
      parameters:
        - in: query
          name: device
          description: pass an optional integer to specify the wanted device
          required: false
          schema:
            type: integer
      responses:
        200:
          description: "array containing json of devices' position"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer
                    position:
                      type: object
                      properties:
                        x:
                          type: integer
                        y: 
                          type: integer
                   
        404:
          description: "Device does not exist."
          
  /devices/messagesToRelay:
    get:
      summary: gets mesh devices' messages that will be relayed
      operationId: position
      description: 
        Path that returns all the device's messages to relay if no value is present or a specific device's if value is present.        
      parameters:
        - in: query
          name: device
          description: pass an optional integer to specify the wanted device
          required: false
          schema:
            type: integer
      responses:
        200:
          description: "array containing json of devices' messages to be relayed"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer
                    messages_to_relay:
                      type: array
                      items:
                        $ref: '#/components/schemas/Message'
                   
        404:
          description: "Device does not exist."

  /devices/messagesRelayed:
    get:
      summary: gets mesh devices' messages that were relayed
      operationId: position
      description: 
        Path that returns all the device's relayed messages if no value is present or a specific device's if value is present.        
      parameters:
        - in: query
          name: device
          description: pass an optional integer to specify the wanted device
          required: false
          schema:
            type: integer
      responses:
        200:
          description: "array containing json of devices' relayed messages"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer
                    messages_relayed:
                      type: array
                      items:
                        $ref: '#/components/schemas/Message'
                   
        404:
          description: "Device does not exist."
          
  /devices/messagesReceived:
    get:
      summary: gets mesh devices' messages that were received
      operationId: position
      description: 
        Path that returns all the device's received messages if no value is present or a specific device's if value is present.        
      parameters:
        - in: query
          name: device
          description: pass an optional integer to specify the wanted device
          required: false
          schema:
            type: integer
      responses:
        200:
          description: "array containing json of devices' received messages"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    device_id:
                      type: integer
                    messages_received:
                      type: array
                      items:
                        $ref: '#/components/schemas/Message'
                   
        404:
          description: "Device does not exist."

  /tick:
    post:
      summary: update grid
      operationId: position
      description: 
        "Path that updates the grid by given number of ticks."
      parameters:
        - in: query
          name: n_ticks
          description: Optional number of ticks. Default is 1
          required: false
          schema:
            type: integer
      responses:
        200:
          description: "Mesh Grid updated"
  
  /message:
    post:
      summary: Request to send a new message to the mesh grid
      operationId: sendMessage
      description: 
        Request to send a new message to the mesh grid. The message should be inside the request body as well as the ID of the device in the destination. 
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  description: New message to be sent
                  type: string
                recipient_id:
                  description: ID of the device to receive the message
                  type: integer
              required:
                - message
                - recipient_id
        required: true
      responses:
        200:
          description: "Message sent correctly."
        400:
          description: "Recipient does not exist."

components:
  schemas:
    Message:
      type: object
      required:
      - id
      - name
      - manufacturer
      - releaseDate
      properties:
        type:
          type: string
          example: Request
        source:
          type: integer
          example: 0
        destination:
          type: integer
          example: 9
        lastHop:
          type: integer
          example: 7
        content:
          type: string
          example: This is a message