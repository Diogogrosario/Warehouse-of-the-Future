version: "3.8"
services:
    frontend:
        build: ./frontend
        environment:
            CHOKIDAR_USEPOLLING: "true"
        ports:
            - 3000:3000
        volumes:
            - ./frontend/src:/app/frontend/src
            - ./frontend/public:/app/frontend/public
        stdin_open: true
        tty: true

    grafana:
        image: grafana/grafana
        build: ./grafana
        container_name: grafana
        ports:
            - 9000:3000
        volumes:
            - grafana-data:/app/grafana
            - ./grafana/dashboards:/etc/grafana/dashboards
            - ./grafana/provisioning:/etc/grafana/provisioning
        networks:
          - grafnet

    worker:
      build: ./worker
      ports:
        - 8080:8080
      volumes:
        - ./worker:/app

    backend:
        build: ./backend
        ports:
            - 8001:5000
        env_file:
            - ./backend/.env
        volumes:
            - ./backend:/app

networks:
    grafnet:
        external: false

volumes:
    grafana-data:
        external: false
