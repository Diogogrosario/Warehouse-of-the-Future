version: "3.8"
services:
  frontend:
    build: ./frontend
    ports:
      - 8000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  backend:
    build: ./backend
    ports:
      - 8001:5000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      
  worker:
    build: ./worker
    ports:
      - 8080:8080
    volumes:
      - ./worker:/app

  mongo:
    image: mongo
    container_name: mongodb
    volumes:
      - ./database:/data/database
    ports:
      - 27017:27017
    networks:
      - mongo-compose-network

  mongo-express:
    image: mongo-express
    ports:
      - 5000:8081
    env_file:
      - ./database/.env
    links:
      - mongo
    networks:
      - mongo-compose-network

networks:
    mongo-compose-network:
      driver: bridge
