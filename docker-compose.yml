version: "3.8"
services:
    frontend:
        build: ./frontend
        environment:
            CHOKIDAR_USEPOLLING: "true"
        ports:
            - 3000:3000
        volumes:
            - ./frontend/src:/app/frontend/src
            - ./frontend/public:/app/frontend/public
        stdin_open: true
        tty: true

    grafana:
        image: grafana/grafana
        build: ./grafana
        container_name: grafana
        ports:
            - 9000:3000
        volumes:
            - grafana-data:/app/grafana
            - ./grafana/dashboards:/etc/grafana/dashboards
            - ./grafana/provisioning:/etc/grafana/provisioning
        networks:
            - grafnet

    backend:
        build: ./backend
        ports:
            - 8001:5000
        env_file:
            - ./backend/.env
        volumes:
            - ./backend:/app

    mongo:
        image: mongo
        container_name: mongodb
        volumes:
            - ./database:/data/database
        ports:
            - 27017:27017
        networks:
            - mongo-compose-network

    mongo-express:
        image: mongo-express
        ports:
            - 5000:8081
        env_file:
            - ./database/.env
        links:
            - mongo
        networks:
            - mongo-compose-network

networks:
    mongo-compose-network:
        driver: bridge
    grafnet:
        external: false

volumes:
    grafana-data:
        external: false
